name: .NET Core Desktop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:   # permette l'esecuzione manuale

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # Installa l'SDK .NET corretto (versione 10.0.x)
    - name: Install .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # Modificato per supportare net10.0

    # Compila il progetto usando dotnet build. Questo comando esegue anche il restore delle dipendenze.
    - name: Build the project
      run: dotnet build TranslationProject.csproj --configuration Release

    - name: Publish the app (self-contained)
      run: dotnet publish TranslationProject.csproj --configuration Release --runtime win-x64 --self-contained true -o publish

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TranslationProject-Release
        path: bin/Release/net10.0-windows/
