name: Build and Publish .NET App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Pubblica l'app (single file)
      run: dotnet publish TranslationProject.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish

    - name: Debug - Elenca file nella cartella publish
      run: |
        if (Test-Path ./publish) {
          Write-Host "Contenuto di ./publish:"
          Get-ChildItem ./publish -Recurse
        } else {
          Write-Host "Cartella ./publish non trovata!"
          exit 1
        }

    - name: Carica l'artefatto
      uses: actions/upload-artifact@v4
      with:
        name: TranslationProject-Release
        path: ./publish/
