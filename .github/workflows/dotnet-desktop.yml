name: Build C++ Desktop App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages (se usi vcpkg, Conan, ecc.)
      run: |
        # Esempio con vcpkg
        # git clone https://github.com/Microsoft/vcpkg.git
        # .\vcpkg\bootstrap-vcpkg.bat
        # .\vcpkg\vcpkg install

    - name: Build Solution
      run: msbuild YourSolution.sln /p:Configuration=Release /p:Platform=x64

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: CppApp-Release
        path: |
          x64/Release/*.exe
          x64/Release/*.dll
