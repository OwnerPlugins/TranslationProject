name: Build and release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish single-file exe
      run: dotnet publish TranslationProject.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o ./publish_exe

    - name: Zip (exe + README + LICENSE)
      run: |
        Copy-Item README.md, LICENSE ./publish_exe/ -ErrorAction SilentlyContinue
        Compress-Archive -Path ./publish_exe/* -DestinationPath ./TranslationProject.zip -Force

    # every push to main: build is downloadable from the Actions page (not committed to the repo)
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: TranslationProject-${{ github.run_number }}
        path: ./publish_exe/TranslationProject.exe

    # tag v2.8, v2.9 ...: create the GitHub Release with the exe and the zip
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        name: Translation Tool ${{ github.ref_name }}
        body_path: RELEASE_NOTES.md
        files: |
          ./publish_exe/TranslationProject.exe
          ./TranslationProject.zip
