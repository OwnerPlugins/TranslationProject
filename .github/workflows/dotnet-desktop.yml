name: Build and Publish .NET App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Pubblica l'app (warning soppressi)
      run: dotnet publish TranslationProject.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=none -p:DebugSymbols=false -o ./publish --verbosity quiet -nowarn:CS8618,CS8602,CS8622,CS8625,CS8600,CS8601

    - name: Debug - Elenca file
      run: Get-ChildItem ./publish -Recurse

    - name: Carica l'artefatto
      uses: actions/upload-artifact@v4
      with:
        name: TranslationProject-Release
        path: ./publish/
        if-no-files-found: error
