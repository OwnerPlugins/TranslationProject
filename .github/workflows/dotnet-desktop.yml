name: Build and Publish .NET App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Permette l'esecuzione manuale dalla UI di GitHub

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # La versione del tuo progetto

    - name: Pubblica l'app (self-contained)
      run: dotnet publish TranslationProject.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -o publish

    # Ora carica l'eseguibile e tutti i file necessari come artefatto
    - name: Carica gli artefatti di build
      uses: actions/upload-artifact@v4
      with:
        name: TranslationProject-Release
        path: publish/
