name: Build e commit dello zip con l'exe

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Pubblica l'app
      run: dotnet publish TranslationProject.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=none -p:DebugSymbols=false -o ./publish_exe --verbosity quiet -nowarn:CS8618,CS8602,CS8622,CS8625,CS8600,CS8601

    # - name: Copia msgfmt.exe
      # run: |
        # if (Test-Path "msgfmt.exe") {
            # Copy-Item "msgfmt.exe" "./publish_exe/" -Force
            # Write-Host "✅ msgfmt.exe copiato"
        # } else {
            # Write-Host "⚠️ msgfmt.exe non trovato"
            # exit 1
        # }

    - name: Crea zip
      run: Compress-Archive -Path ./publish_exe/* -DestinationPath ./TranslationProject.zip -Force

    - name: Configura git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Commit e push dello zip
      run: |
        # Stash delle modifiche locali
        git stash push -m "workflow-stash" || echo "Nessuna modifica da stashare"
        
        # Pull con rebase
        git pull origin main --rebase || echo "Pull fallito, si procede comunque"
        
        # Rimuovi lo zip vecchio e aggiungi quello nuovo
        git add TranslationProject.zip
        
        # Commit solo se ci sono modifiche
        git commit -m "Aggiorna build - ${{ github.run_number }}" || echo "Nessuna modifica da committare"
        
        # Push con force-with-lease per sicurezza
        git push origin HEAD:main --force-with-lease
        
